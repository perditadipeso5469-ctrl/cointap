<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Tap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Monetag: ZONE_ID 2 jaygay boshan -->
<script src="//libtl.com/sdk.js" data-zone="ZONE_ID" data-sdk="show_ZONE_ID"></script>
<style>
  :root{--bg:var(--tg-theme-bg-color,#12161c);--text:var(--tg-theme-text-color,#f2f4f7);--hint:var(--tg-theme-hint-color,#8b95a3);
    --card:var(--tg-theme-secondary-bg-color,#1b212a);--btn:var(--tg-theme-button-color,#3b82f6);--btn-text:var(--tg-theme-button-text-color,#fff);--gold:#f5b829}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;padding:max(env(safe-area-inset-top),16px) 16px max(env(safe-area-inset-bottom),16px)}
  .hello{color:var(--hint);font-size:14px;margin:4px 0 0}
  .balance{font-size:52px;font-weight:800;margin:6px 0 0;color:var(--gold);font-variant-numeric:tabular-nums}
  .label{color:var(--hint);font-size:14px;margin-bottom:18px}
  .coin{width:200px;height:200px;border-radius:50%;border:0;cursor:pointer;font-size:72px;transition:transform .08s;
    background:radial-gradient(circle at 35% 30%,#ffe08a,#f5b829 55%,#c98a0a);
    box-shadow:0 10px 30px rgba(245,184,41,.35),inset 0 -8px 16px rgba(0,0,0,.18)}
  .coin:active{transform:scale(.94)}
  .float{position:fixed;font-weight:800;color:var(--gold);pointer-events:none;animation:up .8s ease-out forwards}
  @keyframes up{to{transform:translateY(-70px);opacity:0}}
  .list{width:100%;max-width:420px;margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .row{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .row b{display:block;font-size:15px}.row span{font-size:13px;color:var(--hint)}
  .go{background:var(--btn);color:var(--btn-text);border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .go:disabled{opacity:.5}.wd{background:#16a34a}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .modal.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
  .sheet h3{margin:0;font-size:18px}.sheet p{margin:0;font-size:13px;color:var(--hint)}
  .sheet select,.sheet input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--hint);background:var(--bg);color:var(--text);font-size:16px;user-select:text}
  .btns{display:flex;gap:10px}.btns button{flex:1}
  .cancel{background:transparent;color:var(--hint);border:1px solid var(--hint)}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  #gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:30;font-size:16px}
  @media (prefers-reduced-motion:reduce){.float{animation:none;opacity:0}}
</style>
</head>
<body>
  <p class="hello" id="hello">Welcome</p>
  <div class="balance" id="bal">0</div>
  <div class="label">coins</div>
  <button class="coin" id="coin" aria-label="Tap to earn a coin">🪙</button>

  <div class="list">
    <div class="row"><div><b id="vTitle">Watch ad</b><span>Short video</span></div><button class="go" id="adReward">Watch</button></div>
    <div class="row"><div><b id="pTitle">Bonus popup</b><span>Opens in a new tab</span></div><button class="go" id="adPopup">Open</button></div>
    <div class="row"><div><b>Withdraw</b><span id="wdInfo"></span></div><button class="go wd" id="wdOpen">Withdraw</button></div>
  </div>

  <div class="modal" id="modal"><div class="sheet">
    <h3>Withdraw coins</h3><p id="wdRule"></p>
    <select id="wdMethod"></select>
    <input id="wdNumber" type="tel" inputmode="numeric" placeholder="Account number (01XXXXXXXXX)">
    <input id="wdAmount" type="number" inputmode="numeric" placeholder="Coins to withdraw">
    <div class="btns"><button class="go cancel" id="wdCancel">Cancel</button><button class="go wd" id="wdSend">Send request</button></div>
  </div></div>

  <div id="gate">Please open this app from Telegram.</div>
  <div class="toast" id="toast"></div>

<script>
const ZONE_ID = "ZONE_ID";          // <-- Monetag Zone ID
const INAPP_ADS = true;

const $ = id => document.getElementById(id);
const tg = window.Telegram && Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); }
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (!tg || !tg.initData){ $('gate').style.display = 'flex'; }
$('hello').textContent = user ? 'Hi, ' + user.first_name : 'Welcome';

let serverBal = 0, pending = 0, cfg = { videoReward:50, popReward:25, minWithdraw:5000, coinsPerTaka:100, methods:['bKash','Nagad','Rocket'], postbackMode:false };
const render = () => { $('bal').textContent = (serverBal + pending).toLocaleString(); };
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

async function api(path, body){
  const r = await fetch(path, { method:'POST', headers:{'content-type':'application/json','x-init-data': tg ? tg.initData : ''}, body: JSON.stringify(body||{}) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
function applyCfg(){
  $('vTitle').textContent = 'Watch ad, get ' + cfg.videoReward + ' coins';
  $('pTitle').textContent = 'Bonus popup, get ' + cfg.popReward + ' coins';
  $('wdInfo').textContent = 'Min ' + cfg.minWithdraw.toLocaleString() + ' coins';
  $('wdRule').textContent = cfg.coinsPerTaka + ' coins = 1 Taka. Minimum ' + cfg.minWithdraw.toLocaleString() + ' coins.';
  $('wdMethod').innerHTML = cfg.methods.map(m => '<option>'+m+'</option>').join('');
}
async function refresh(){
  try { const j = await api('/api/me'); serverBal = j.balance; cfg = j.cfg; applyCfg(); render(); } catch(e){ toast(e.message); }
}
applyCfg(); if (tg && tg.initData) refresh();

/* TAP: server e batch kore pathay */
$('coin').addEventListener('click', e=>{
  pending++; render();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  const f=document.createElement('div'); f.className='float'; f.textContent='+1';
  f.style.left=e.clientX+'px'; f.style.top=(e.clientY-20)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),800);
});
let flushing = false;
setInterval(async ()=>{
  if (flushing || pending === 0 || !(tg && tg.initData)) return;
  flushing = true;
  const n = Math.min(pending, 50); pending -= n;
  try { const j = await api('/api/tap', {n}); serverBal = j.balance; } catch(e){ pending += n; }
  flushing = false; render();
}, 1000);

/* ADS */
const adFn = () => { const f = window['show_' + ZONE_ID]; return typeof f === 'function' ? f : null; };
async function waitForCredit(before){
  for (let i=0;i<6;i++){ await new Promise(r=>setTimeout(r,2000)); await refresh(); if (serverBal > before) return true; }
  return false;
}
async function runAd(btn, type){
  const show = adFn();
  if (!show){ toast('Ad is not ready.'); return; }
  btn.disabled = true;
  try{
    const before = serverBal;
    const opts = { ymid: String(user ? user.id : ''), requestVar: type };
    if (type === 'pop') opts.type = 'pop';
    await show(opts);
    if (cfg.postbackMode){
      toast((await waitForCredit(before)) ? 'Coins added' : 'Reward is processing...');
    } else {
      const j = await api('/api/ad/claim', { type }); serverBal = j.balance; render(); toast('Coins added');
    }
  }catch(err){ toast(err && err.message ? err.message : 'No ad available. Try later.'); }
  finally{ btn.disabled = false; }
}
$('adReward').onclick = e => runAd(e.currentTarget, 'video');
$('adPopup').onclick  = e => runAd(e.currentTarget, 'pop');
window.addEventListener('load', ()=>{
  const show = adFn();
  if (INAPP_ADS && show){ try{ show({ type:'inApp', inAppSettings:{ frequency:2, capping:0.1, interval:30, timeout:5, everyPage:false } }); }catch(e){} }
});

/* WITHDRAW */
$('wdOpen').onclick = ()=>{
  if (serverBal < cfg.minWithdraw){ toast('Need at least ' + cfg.minWithdraw.toLocaleString() + ' coins'); return; }
  $('wdAmount').value = serverBal; $('modal').classList.add('on');
};
$('wdCancel').onclick = ()=> $('modal').classList.remove('on');
$('wdSend').onclick = async ()=>{
  const btn = $('wdSend'); btn.disabled = true;
  try{
    const j = await api('/api/withdraw', { method:$('wdMethod').value, number:$('wdNumber').value.trim(), amount:parseInt($('wdAmount').value,10) });
    serverBal = j.balance; render(); $('modal').classList.remove('on');
    toast('Request sent. You will get a message when paid.');
  }catch(e){ toast(e.message); }
  btn.disabled = false;
};
</script>
</body>
</html>
